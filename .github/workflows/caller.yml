name: Call AWS Nuke Cleanup

on:
  pull_request:
  workflow_dispatch:

    inputs:
      account_id:
        required: true
        type: string
        default: "123456789012"


permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  call-cleanup:
    uses: kkumar06-tech/test_gh_actions/.github/workflows/called.yml@main
    with:
      account_id: ${{inputs.account_id}}