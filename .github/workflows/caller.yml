name: Call AWS Nuke Cleanup

on:
  workflow_dispatch:

    inputs:
      account_id:
        required: true
        type: string
        default: "123456789012"


permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  call-cleanup:
    uses: kkumar06-tech/test_gh_actions/.github/workflows/called.yml@test_branch
    with:
      account_id: ${{inputs.account_id}}